<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAYGROUND</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <div class="video-wrapper">
    <video class="video-bg" autoplay loop muted playsinline>
      <source src="/assets/video/background-video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </source>
    </video>
    <div class="flicker-overlay"></div>
  </div>

  <!-- Edge swipe zone: invisible strip on right edge for swipe-to-open gesture -->
  <div id="swipe-edge-zone" aria-hidden="true"></div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <h1 id="playground-title"><a href="/" style="text-decoration:none;color:inherit;">PLAYGROUND</a></h1>
    <button id="main-menu-toggle" class="main-menu-toggle" aria-label="Open main menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Nav bar (horizontal on desktop, slide-in overlay on mobile) -->
  <nav class="main-nav">
    <ul>
      <li><a href="/" data-nav-link>Intro</a></li>
      <li><a href="/presentation/" data-nav-link>Presentation</a></li>
      <li><a href="/references/" data-nav-link>References</a></li>
      <li><a href="/archive/" data-nav-link>Archive</a></li>
      <li><a href="/events/" data-nav-link>Happenings</a></li>
      <li><a href="/contact/" data-nav-link>Contact</a></li>
    </ul>
    <button id="language-toggle">FRANÇAIS</button>
  </nav>

  <!-- Right side audio menu -->
  <div class="right-audio-menu">
    <div class="audio-player">
      <button id="audio-toggle" class="audio-btn">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 16 16" style="display: block;">
          <polygon points="3,2 13,8 3,14" fill="white"/>
        </svg>
        <svg id="stop-icon" width="16" height="16" viewBox="0 0 16 16" style="display: none;">
          <rect x="3" y="3" width="10" height="10" fill="white"/>
        </svg>
      </button>
      <div id="time-remaining" class="time-display">00:00</div>
      <input type="range" id="audio-progress" class="audio-progress" min="0" max="100" value="0" step="1">
    </div>
  </div>

  <!-- Audio menu toggle (right side burger) -->
  <button id="audio-menu-toggle" class="audio-menu-toggle" aria-label="Open audio menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <audio id="background-audio" src="/assets/audio/song.mp3" loop></audio>

  <main class="main-content">
    <article class="news-post">

  
    <div class="post-cover">
      <img src="/assets/images/red.jpg" alt="Tester" />
    </div>
  

  <header class="post-header">
    <div data-lang="fr" class="language-content">
      <h2 class="post-title">Tester</h2>
    </div>
    <div data-lang="en" class="language-content">
      <h2 class="post-title">Test</h2>
    </div>
    <div class="post-meta">
      <time datetime="2026-05-04">4 May 2026</time>
      <span class="post-author"> — Bob S</span>
    </div>
  </header>

  <div data-lang="fr" class="language-content post-body">
    <p>test in french</p>

  </div>
  <div data-lang="en" class="language-content post-body">
    <p>test in english</p>

  </div>

  <footer class="post-footer">
    <a href="/events/" data-nav-link class="back-link"><span class="back-arrow">←</span> Events</a>
  </footer>

</article>

  </main>

  <script src="/scripts/audio.js"></script>
  <script src="/scripts/spa.js"></script>

</body>
</html>
