body_fr: |
  Pour l'instant, pour nous contacter, veuillez parler à vos rats souterrains locaux,

  ou demandez aux arbres — *en chuchotant ; très important !* — dans les Buttes-Chaumont.

body_en: |
  For now, in order to contact us, please speak to your local underground rats,

  or ask the trees — *by whispering; very important!* — in Buttes-Chaumont.
