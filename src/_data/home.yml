greeting_fr: |
  Chers amis,

  Vous êtes ici car vous êtes venus, viendrez ou êtes simplement intéressés par les sessions PLAYGROUND.

  Puisque nous tâtonnons dans nos recherches artistiques, il n'est pas toujours évident d'expliquer ce que nous faisons. Ce site web est une tentative de le définir, tout en préservant les zones d'incertitudes inhérentes à toute pratique expérimentale.

greeting_en: |

  Dear friends,

  You're here because you came to, will come to or are simply interested in PLAYGROUND sessions.

  As we are groping our way through our own artistic research, it is not always easy to explain what we do. This website is an attempt to define it, while preserving the areas of uncertainty inherent in any experimental practice.

