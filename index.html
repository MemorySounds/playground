<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PLAYGROUND</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- <div class="grain-overlay"></div> -->

  <div class="video-wrapper">
    <video class="video-bg" autoplay loop muted playsinline>
      <source src="assets/video/background-video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </source>
    </video>
    <div class="flicker-overlay"></div>
  </div>
  <!-- Main Navigation Header -->
  <header class="main-header">
    <h1 id="playground-title">PLAYGROUND</h1>
    <button id="main-menu-toggle" class="main-menu-toggle" aria-label="Open main menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="main-nav">
      <ul>
        <li><a href="#/" data-link>Intro</a></li>
        <li><a href="#/presentation" data-link>Presentation</a></li>
        <li><a href="#/references" data-link>References</a></li>
        <!-- <li><a href="#/archive" data-link>Archive</a></li> -->
        <li><a href="#/contact" data-link>Contact</a></li>
      </ul>
      <button id="language-toggle">FRANÇAIS</button>
    </nav>
  </header>

  <!-- Right side audio menu -->
  <div class="right-audio-menu">
    <div class="audio-player">
      <button id="audio-toggle" class="audio-btn">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 16 16" style="display: block;">
          <polygon points="3,2 13,8 3,14" fill="white"/>
        </svg>
        <svg id="stop-icon" width="16" height="16" viewBox="0 0 16 16" style="display: none;">
          <rect x="3" y="3" width="10" height="10" fill="white"/>
        </svg>
      </button>
      <div id="time-remaining" class="time-display">00:00</div>
      <input type="range" id="audio-progress" class="audio-progress" min="0" max="100" value="0" step="1">
    </div>
  </div>

  <!-- Right menu toggle (center-right, vertical burger) -->
  <button id="audio-menu-toggle" class="audio-menu-toggle" aria-label="Open audio menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <audio id="background-audio" src="assets/audio/song.mp3" loop></audio>
  <main id="app"></main>
  <script src="scripts/spa.js"></script>
  <script src="scripts/audio.js" ></script>
</body>
</html>
