<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PLAYGROUND</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Main Navigation Header -->
  <header class="main-header">
    <h1>PLAYGROUND</h1>
    <button id="main-menu-toggle" class="main-menu-toggle" aria-label="Open main menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="main-nav">
      <ul>
        <li><a href="#/" data-link>Home</a></li>
        <li><a href="#/presentation" data-link>Presentation</a></li>
        <li><a href="#/references" data-link>References</a></li>
        <!-- <li><a href="#/archive" data-link>Archive</a></li> -->
        <li><a href="#/contact" data-link>Contact</a></li>
      </ul>
      <button id="language-toggle">FR</button>
    </nav>
  </header>

  <!-- Right side audio menu -->
  <div class="right-audio-menu">
    <div class="audio-player">
      <button id="audio-toggle" class="audio-btn">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 16 16" style="display: block;">
          <polygon points="3,2 13,8 3,14" fill="white"/>
        </svg>
        <svg id="stop-icon" width="16" height="16" viewBox="0 0 16 16" style="display: none;">
          <rect x="3" y="3" width="10" height="10" fill="white"/>
        </svg>
      </button>
      <input type="range" id="audio-progress" class="audio-progress" min="0" max="100" value="0" step="1">
    </div>
  </div>

  <!-- Right menu toggle (center-right, vertical burger) -->
  <button id="audio-menu-toggle" class="audio-menu-toggle" aria-label="Open audio menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <audio id="background-audio" src="assets/audio/song2.mp3" loop></audio>
  <main id="app"></main>
  <script src="spa.js"></script>
  <script>
    const audio = document.getElementById('background-audio');
    const audioBtn = document.getElementById('audio-toggle');
    const progress = document.getElementById('audio-progress');
    const playIcon = document.getElementById('play-icon');
    const stopIcon = document.getElementById('stop-icon');

    // Play/pause button
    audioBtn.onclick = () => {
      if (audio.paused) {
        audio.play();
        playIcon.style.display = 'none';
        stopIcon.style.display = 'block';
      } else {
        audio.pause();
        playIcon.style.display = 'block';
        stopIcon.style.display = 'none';
      }
    };

    // Update progress bar as audio plays
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    // Seek when user moves the slider
    progress.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
    });

    // Unlock audio on first user gesture
    function unlockAudio() {
      audio.play().then(() => {
        playIcon.style.display = 'none';
        stopIcon.style.display = 'block';
      }).catch(() => {});
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    }
    window.addEventListener('click', unlockAudio);
    window.addEventListener('keydown', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);
  </script>
</body>
</html>
